# shapeshift-serve — a tiny, dependency-light HTTP server that puts a local web
# console in front of the OSS shaper (infer · shape · inspect · cost).
#
# Deliberately in the single-static-binary ethos: the HTTP server is hand-rolled
# on `std::net` (thread-per-connection over a shared listener) — NO async runtime,
# NO web framework, NO cloud SDK, NO extra C code. The UI is three static files
# embedded into the binary at compile time (`include_str!`), so `shapeshift serve`
# stays one relocatable musl-static binary with no Node/JVM/Python at runtime.
#
# This crate is Apache-2.0 OSS: it only ever makes the engine a better *shaper*
# (a UI over the existing CLI verbs). It has no scheduler, run queue, catalog
# server, metering, connectors, or multi-tenant auth — those are an orchestrator's
# job by design (see ../ARCHITECTURE.md §14).
[package]
name = "shapeshift-serve"
description = "shapeshift serve — a local web console (a single hand-rolled HTTP server, no async runtime) over the OSS shaper: infer a spec, shape JSON into Parquet/Iceberg, inspect the output, and price a run against MAR."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Catalog & engines: browse a REST catalog (read-only). The CLI turns it on with its
# `object_store` feature, which already links the catalog client.
catalog = ["dep:shapeshift-objstore"]
# Datasets that pull: an endpoint (`source.http`) or a database (`source.mysql`). The CLI's
# `http` and `mysql` features turn these on.
http = ["dep:shapeshift-source-http"]
mysql = ["dep:shapeshift-source-mysql"]
postgres = ["dep:shapeshift-source-postgres"]

[dependencies]
shapeshift-core = { workspace = true }
shapeshift-json = { workspace = true }
shapeshift-parquet = { workspace = true }
shapeshift-iceberg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# A run id's random suffix: ids recorded in snapshots must never repeat (a fresh run log, or
# another console writing the same table, would otherwise take a new run for an earlier one).
uuid = { workspace = true }
# Alerts are POSTed to webhooks (Slack, Teams, a paging service), which are HTTPS. rustls with
# Mozilla's roots bundled (webpki-roots), so delivery works with no CA store on the box.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Connector tokens: SHA-256 to keep them hashed, and the system's randomness to make them.
# Already linked for ureq's TLS.
ring = "0.17"
shapeshift-objstore = { workspace = true, optional = true }
shapeshift-source-http = { workspace = true, optional = true }
shapeshift-source-mysql = { workspace = true, optional = true }
shapeshift-source-postgres = { workspace = true, optional = true }
