# docker-compose.yaml — a fully local lakehouse stack for the shapeshift catalog demos.
#
#   docker compose -f scripts/docker-compose.yaml up -d
#   cp scripts/env.example scripts/.env && source scripts/.env
#
# Brings up:
#   redpanda  — Kafka API on :9092                  (streaming source, Demos 1 & 4)
#   postgres  — Postgres on :5432                    (database source/sink, Demos 2 & 3)
#   nessie    — Iceberg REST catalog on :19120       (the catalog in the middle)
#   minio     — S3-compatible object store on :9000  (where Iceberg tables land)
#   createbuckets — one-shot: makes the `lake` bucket in MinIO
#
# Nothing here is shapeshift-specific; it is a stand-in for whatever streaming system,
# database, catalog, and object store you already run. shapeshift only ever sees JSONL in
# and an Iceberg table out.
name: shapeshift-catalog-demos

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    # wal_level=logical enables Debezium CDC (Demo 4).
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      # Bound to loopback so the demo store isn't reachable from other hosts on the network.
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    # Create the private `lake` bucket. No `mc anonymous set download` — the bucket stays
    # private; clients authenticate with the AWS_* creds from .env (path-style to MinIO).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb -p local/lake &&
      echo 'bucket lake ready'"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    depends_on:
      minio:
        condition: service_healthy
      # Start only after the `lake` bucket exists, so a fresh stack can't race first access.
      createbuckets:
        condition: service_completed_successfully
    environment:
      # In-memory version store keeps the demo stateless; use JDBC/RocksDB for real use.
      nessie.version.store.type: IN_MEMORY
      # Nessie's Iceberg REST endpoint hands out the warehouse + S3 access to clients.
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://lake/warehouse
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:s3creds
      s3creds.name: minio
      s3creds.secret: minio123
    ports:
      - "19120:19120"   # REST: http://localhost:19120/iceberg/
