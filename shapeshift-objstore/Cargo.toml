[package]
name = "shapeshift-objstore"
description = "shapeshift object-store sink — writes shapeshift's Parquet output to S3 / GCS / Azure (or file:// / memory://) via the object_store crate. A local row-group-bounded temp Parquet is streamed to the store with a multipart upload, so RAM stays bounded. Implements shapeshift-core's Sink trait; the cloud SDKs live only here (behind the CLI's off-by-default `object_store` feature)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
shapeshift-core = { workspace = true }
shapeshift-parquet = { workspace = true }
shapeshift-iceberg = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
# The `Stream` trait, to hand `delete_stream` many keys at once (comes with object_store).
futures-core = "0.3"
# The REST catalog client (0.5). The same reqwest, with the same features, that
# object_store already links: a catalog adds no crate to the object-store build.
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }

[dev-dependencies]
parquet = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
# Only to wrap a store in a request-counting `ObjectStore` (comes with object_store).
async-trait = "0.1"
