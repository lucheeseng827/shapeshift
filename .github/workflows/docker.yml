# Build the lean `shapeshift` CLI as a multi-arch image and push it to Docker Hub
# (mancube/shapeshift). The image is the default static musl build on `scratch`
# (see ./Dockerfile) — the containerized form of the release binary.
#
# Fires on the `vX.Y.Z` tag every release carries, and builds exactly that tag:
# pushes mancube/shapeshift:<version> and moves :latest. A pre-release tag
# (`v0.3.0-rc.1`) publishes its version tag but leaves :latest alone. A manual run
# builds a given tag and only pushes when `push` is set; otherwise it is a dry run.
#
# Requires DOCKER_USERNAME / DOCKER_PASSWORD (a Docker Hub access token with
# Read/Write on mancube/shapeshift) in the `cicd` environment.

name: Publish Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.2.0)"
        required: true
      push:
        description: "Push to Docker Hub (false = build only, a dry run)"
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: mancube/shapeshift
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    # Forks carry no Docker Hub credentials; only the canonical repo publishes.
    if: github.repository == 'lucheeseng827/shapeshift'
    runs-on: ubuntu-24.04
    environment: cicd
    steps:
      - name: Resolve tag, version, and push decision
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"; PUSH="$INPUT_PUSH"
          else
            TAG="$GITHUB_REF_NAME"; PUSH=true
          fi
          # Docker tags cannot carry `+build` metadata, so it is not accepted here.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag: '$TAG'"; exit 1
          fi
          V="${TAG#v}"
          TAGS="$IMAGE:$V"
          case "$V" in *-*) ;; *) TAGS="$TAGS,$IMAGE:latest" ;; esac
          { echo "tag=$TAG"; echo "version=$V"; echo "push=$PUSH"; echo "tags=$TAGS"; } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG -> $TAGS (push=$PUSH)"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.cfg.outputs.tag }}
          persist-credentials: false

      - name: Assert the tag matches the workspace version
        env:
          V: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          # The same check the binary release makes — a tag that disagrees with
          # [workspace.package].version ships a mislabeled image.
          WS="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ "$WS" = "$V" ] || { echo "::error::tag version '$V' != workspace version '$WS'"; exit 1; }

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Docker Hub
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ponytail: arm64 builds under QEMU (~30 min per release). Native arm64 runners
      # plus a manifest-merge job would cut that; worth it if releases get frequent.
      - name: Build (and push) the multi-arch image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.cfg.outputs.tags }}
          # A plain multi-arch manifest (no attestation manifest some runtimes reject).
          provenance: false

      - name: Summary
        env:
          TAGS: ${{ steps.cfg.outputs.tags }}
          PUSH: ${{ steps.cfg.outputs.push }}
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "Pushed $TAGS ($PLATFORMS)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: built $TAGS ($PLATFORMS), not pushed." >> "$GITHUB_STEP_SUMMARY"
          fi
