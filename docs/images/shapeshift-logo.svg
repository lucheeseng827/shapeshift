<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The site header's mark on a tile. The tile is outlined so it reads on GitHub's
       dark ground (#0d1117, almost the tile's own colour) as well as on white. -->
  <rect x="0.25" y="0.25" width="23.5" height="23.5" rx="4" fill="#0d1114" stroke="#3a454c" stroke-width="0.5"/>
  <rect x="2"  y="4"    width="3" height="6" fill="#e2a25c"/>
  <rect x="2"  y="12"   width="3" height="3" fill="#e2a25c"/>
  <rect x="2"  y="17"   width="3" height="4" fill="#e2a25c"/>
  <path d="M9 12.5h4.4m-1.6-2 1.9 2-1.9 2" stroke="#8a989f" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="17" y="4"    width="5" height="5" fill="#5cb9cb"/>
  <rect x="17" y="10.5" width="5" height="5" fill="#5cb9cb"/>
  <rect x="17" y="17"   width="5" height="4" fill="#5cb9cb"/>
</svg>
